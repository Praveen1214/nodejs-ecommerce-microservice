## -------------------------------------------------------
## 1. Scrape istiod control-plane metrics (port http-monitoring = 15014)
## -------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sm-istiod
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: ["istio-system"]
  selector:
    matchLabels:
      app: istiod
  endpoints:
    - port: http-monitoring
      interval: 15s
---
## -------------------------------------------------------
## 2. Scrape envoy sidecar proxies in ecommerce-test pods
##    Each Istio sidecar exposes metrics on port 15090 (http-envoy-prom)
##    Selects pods with Istio sidecar via tlsMode label
## -------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pm-envoy-sidecars
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: ["ecommerce-test"]
  selector:
    matchExpressions:
      - key: security.istio.io/tlsMode
        operator: Exists
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 15s
