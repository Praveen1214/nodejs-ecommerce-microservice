prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Allow ServiceMonitors/PodMonitors from ANY namespace (empty selector = all)
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

    # Select only objects with label release: prometheus
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
    podMonitorSelector:
      matchLabels:
        release: prometheus

grafana:
  enabled: true
  adminPassword: admin
  service:
    type: ClusterIP

# Fix for Docker Desktop / Kind on Windows: disable rootfs hostPath mount
# that requires shared/slave mount propagation (not available on Windows Docker Desktop)
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
