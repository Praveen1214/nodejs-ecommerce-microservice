prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s

    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

    # Select only objects with label release: prometheus (your CR shows this label)
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
    podMonitorSelector:
      matchLabels:
        release: prometheus

grafana:
  enabled: true
  adminPassword: admin
  service:
    type: ClusterIP
