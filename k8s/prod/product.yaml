apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: ecommerce-prod
spec:
  replicas: 0  # Scaled down for t3.small cluster
  selector:
    matchLabels:
      app: product
      environment: production
  template:
    metadata:
      labels:
        app: product
        environment: production
    spec:
      containers:
        - name: product
          image: praveen1214/product-service:56f9554
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_PRODUCT_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_PRODUCT_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: ecommerce-prod
spec:
  selector:
    app: product
    environment: production
  ports:
    - port: 3001
      targetPort: 3001
