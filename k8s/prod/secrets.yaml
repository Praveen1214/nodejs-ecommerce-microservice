apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce-prod
type: Opaque
stringData:
  # Production database credentials - Update these with your production database URIs
  MONGODB_AUTH_URI: "mongodb+srv://your-prod-user:your-prod-password@cluster.mongodb.net/prod-auth-db"
  MONGODB_PRODUCT_URI: "mongodb+srv://your-prod-user:your-prod-password@cluster.mongodb.net/prod-product-db"
  MONGODB_ORDER_URI: "mongodb+srv://your-prod-user:your-prod-password@cluster.mongodb.net/prod-order-db"
  JWT_SECRET: "your-production-jwt-secret-should-be-strong"
  RABBITMQ_URL: "amqp://rabbitmq.ecommerce-prod:5672"
