apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce-prod
spec:
  replicas: 16 # Scaled down for t3.small cluster
  selector:
    matchLabels:
      app: order
      environment: production
  template:
    metadata:
      labels:
        app: order
        environment: production
    spec:
      containers:
        - name: order
          image: praveen1214/order-service:56f9554
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_ORDER_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_ORDER_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce-prod
spec:
  selector:
    app: order
    environment: production
  ports:
    - port: 3002
      targetPort: 3002
