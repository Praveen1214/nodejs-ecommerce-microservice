apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce-prod
spec:
  replicas: 1 # Scaled down for t3.small cluster
  selector:
    matchLabels:
      app: api-gateway
      environment: production
  template:
    metadata:
      labels:
        app: api-gateway
        environment: production
    spec:
      containers:
        - name: api-gateway
          image: abhisheklpeiris/api-gateway-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              value: "production"
            - name: AUTH_SERVICE_URL
              value: "http://auth:3000"
            - name: PRODUCT_SERVICE_URL
              value: "http://product:3001"
            - name: ORDER_SERVICE_URL
              value: "http://order:3002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce-prod
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
    environment: production
  ports:
    - port: 80
      targetPort: 3003
