apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: PORT
          value: "3003"
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_URL
        # API Gateway likely needs to know where other services are, but usually it does this via
        # hardcoded URLs or env vars. I didn't see explicit SERVICE_URL vars in docker-compose,
        # so it might assume localhost or service names.
        # Assuming the code has defaults or uses internal constructs.
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  type: LoadBalancer # Expose this to the outside world
  ports:
  - port: 3003
    targetPort: 3003
