apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ecommerce-test
spec:
  replicas: 1 # Single replica for testing
  selector:
    matchLabels:
      app: auth
      environment: test
  template:
    metadata:
      labels:
        app: auth
        environment: test
    spec:
      containers:
        - name: auth
          image: praveen1214/auth-service:d572329
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "test"
            - name: MONGODB_AUTH_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_AUTH_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: ecommerce-test
spec:
  type: LoadBalancer
  selector:
    app: auth
    environment: test
  ports:
    - name: http
      port: 3000
      targetPort: 3000
