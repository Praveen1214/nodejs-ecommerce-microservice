apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ecommerce-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
      environment: test
  template:
    metadata:
      labels:
        app: rabbitmq
        environment: test
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ecommerce-test
spec:
  type: LoadBalancer
  selector:
    app: rabbitmq
    environment: test
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
