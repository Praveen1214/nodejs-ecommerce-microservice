apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce-test
spec:
  replicas: 6
  selector:
    matchLabels:
      app: order
      environment: test
  template:
    metadata:
      labels:
        app: order
        environment: test
    spec:
      containers:
      - name: order
        image: praveen1214/order-service:d572329
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        env:
        - name: PORT
          value: "3002"
        - name: NODE_ENV
          value: "test"
        - name: MONGODB_ORDER_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MONGODB_ORDER_URI
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce-test
spec:
  selector:
    app: order
    environment: test
  ports:
  - port: 3002
    targetPort: 3002
