apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
      environment: test
  template:
    metadata:
      labels:
        app: order
        environment: test
    spec:
      containers:
        - name: order
          image: abhisheklpeiris/order-service:d572329
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "test"
            - name: MONGODB_ORDER_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_ORDER_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce-test
  labels:
    app: order
    environment: test
spec:
  type: LoadBalancer
  selector:
    app: order
    environment: test
  ports:
    - name: http
      port: 3002
      targetPort: 3002
