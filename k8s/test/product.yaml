apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: ecommerce-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
      environment: test
  template:
    metadata:
      labels:
        app: product
        environment: test
    spec:
      containers:
        - name: product
          image: abhisheklpeiris/product-service:d572329
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "test"
            - name: MONGODB_PRODUCT_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_PRODUCT_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: ecommerce-test
  labels:
    app: product
    environment: test
spec:
  type: LoadBalancer
  selector:
    app: product
    environment: test
  ports:
    - name: http
      port: 3001
      targetPort: 3001
