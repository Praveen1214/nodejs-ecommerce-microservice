name: Build and Deploy to AWS EKS

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # Using the commit SHA as the tag ensures every build is unique and ArgoCD detects changes
  IMAGE_TAG: ${GITHUB_SHA::7}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ env.IMAGE_TAG }}

    - name: Build and Push Order Service
      uses: docker/build-push-action@v5
      with:
        context: ./order
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/order-service:${{ env.IMAGE_TAG }}

    - name: Build and Push Product Service
      uses: docker/build-push-action@v5
      with:
        context: ./product
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/product-service:${{ env.IMAGE_TAG }}

    - name: Build and Push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway-service:${{ env.IMAGE_TAG }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Necessary to push changes back
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set Environment Folders
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "K8S_FOLDER=k8s/prod" >> $GITHUB_ENV
        else
          echo "K8S_FOLDER=k8s/test" >> $GITHUB_ENV
        fi

    - name: Update Image Tags in Manifests
      run: |
        # Update the image tag in the specific environment files
        # We replace the old tag (whatever it was) with the new commit SHA
        sed -i "s|image: $DOCKER_USERNAME/auth-service:.*|image: $DOCKER_USERNAME/auth-service:$IMAGE_TAG|g" ${{ env.K8S_FOLDER }}/auth.yaml
        sed -i "s|image: $DOCKER_USERNAME/order-service:.*|image: $DOCKER_USERNAME/order-service:$IMAGE_TAG|g" ${{ env.K8S_FOLDER }}/order.yaml
        sed -i "s|image: $DOCKER_USERNAME/product-service:.*|image: $DOCKER_USERNAME/product-service:$IMAGE_TAG|g" ${{ env.K8S_FOLDER }}/product.yaml
        sed -i "s|image: $DOCKER_USERNAME/api-gateway-service:.*|image: $DOCKER_USERNAME/api-gateway-service:$IMAGE_TAG|g" ${{ env.K8S_FOLDER }}/api-gateway.yaml

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ${{ env.K8S_FOLDER }}/*.yaml
        git commit -m "chore: update image tags to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
        git push

