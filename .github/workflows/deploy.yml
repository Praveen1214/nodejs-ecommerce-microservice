name: Build and Deploy to AWS EKS

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: k8s-research-cluster
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ env.IMAGE_TAG }}

    - name: Build and Push Order Service
      uses: docker/build-push-action@v5
      with:
        context: ./order
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/order-service:${{ env.IMAGE_TAG }}

    - name: Build and Push Product Service
      uses: docker/build-push-action@v5
      with:
        context: ./product
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/product-service:${{ env.IMAGE_TAG }}

    - name: Build and Push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway-service:${{ env.IMAGE_TAG }}

  deploy-to-eks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

    - name: Set Environment Variables
      id: env-selector
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Creating Production Environment Configuration..."
          echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          echo "K8S_FOLDER=k8s/prod" >> $GITHUB_ENV
          echo "NAMESPACE=ecommerce-prod" >> $GITHUB_ENV
          echo "NAMESPACE_FILE=k8s/base/namespace-prod.yaml" >> $GITHUB_ENV
        else
          echo "Creating Test Environment Configuration..."
          echo "DEPLOY_ENV=test" >> $GITHUB_ENV
          echo "K8S_FOLDER=k8s/test" >> $GITHUB_ENV
          echo "NAMESPACE=ecommerce-test" >> $GITHUB_ENV
          echo "NAMESPACE_FILE=k8s/base/namespace-test.yaml" >> $GITHUB_ENV
        fi

    - name: Update Image Names in Manifests
      run: |
        # Update images in the selected environment folder
        # Using a loop to handle all yaml files in the target directory
        for file in ${{ env.K8S_FOLDER }}/*.yaml; do
          if [ -f "$file" ]; then
            sed -i "s|image: praveen1214/auth-service:latest|image: $DOCKER_USERNAME/auth-service:$IMAGE_TAG|g" "$file"
            sed -i "s|image: praveen1214/order-service:latest|image: $DOCKER_USERNAME/order-service:$IMAGE_TAG|g" "$file"
            sed -i "s|image: praveen1214/product-service:latest|image: $DOCKER_USERNAME/product-service:$IMAGE_TAG|g" "$file"
            sed -i "s|image: praveen1214/api-gateway-service:latest|image: $DOCKER_USERNAME/api-gateway-service:$IMAGE_TAG|g" "$file"
            echo "Updated images in $file"
          fi
        done

    - name: Deploy to Kubernetes
      run: |
        echo "Deploying to ${{ env.DEPLOY_ENV }} environment..."
        
        # Apply Namespace first
        kubectl apply -f ${{ env.NAMESPACE_FILE }}
        
        # Apply manifests from the specific environment folder
        kubectl apply -f ${{ env.K8S_FOLDER }}/
        
        # Explicitly wait for rollout (optional but good practice)
        # kubectl rollout status deployment/api-gateway -n ${{ env.NAMESPACE }}
