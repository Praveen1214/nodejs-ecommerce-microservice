name: Build and Deploy to AWS EKS

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set Image Tag
      id: vars
      run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ steps.vars.outputs.tag }}


    - name: Build and Push Order Service
      uses: docker/build-push-action@v5
      with:
        context: ./order
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/order-service:${{ steps.vars.outputs.tag }}

    - name: Build and Push Product Service
      uses: docker/build-push-action@v5
      with:
        context: ./product
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/product-service:${{ steps.vars.outputs.tag }}

    - name: Build and Push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway-service:${{ steps.vars.outputs.tag }}

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set Image Tag
      id: vars
      run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Set Environment Folders
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "K8S_FOLDER=k8s/prod" >> $GITHUB_ENV
        else
          echo "K8S_FOLDER=k8s/test" >> $GITHUB_ENV
        fi

    - name: Update Image Tags in Manifests
      run: |
        # Use the tag calculated in the previous step
        TAG=${{ steps.vars.outputs.tag }}
        sed -i "s|image: $DOCKER_USERNAME/auth-service:.*|image: $DOCKER_USERNAME/auth-service:$TAG|g" ${{ env.K8S_FOLDER }}/auth.yaml
        sed -i "s|image: $DOCKER_USERNAME/order-service:.*|image: $DOCKER_USERNAME/order-service:$TAG|g" ${{ env.K8S_FOLDER }}/order.yaml
        sed -i "s|image: $DOCKER_USERNAME/product-service:.*|image: $DOCKER_USERNAME/product-service:$TAG|g" ${{ env.K8S_FOLDER }}/product.yaml
        sed -i "s|image: $DOCKER_USERNAME/api-gateway-service:.*|image: $DOCKER_USERNAME/api-gateway-service:$TAG|g" ${{ env.K8S_FOLDER }}/api-gateway.yaml

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ${{ env.K8S_FOLDER }}/*.yaml
        git commit -m "chore: update image tags to ${{ steps.vars.outputs.tag }} [skip ci]" || echo "No changes to commit"
        git push


