name: Build and Deploy to AWS EKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: k8s-research-cluster
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ env.IMAGE_TAG }}

    - name: Build and Push Order Service
      uses: docker/build-push-action@v5
      with:
        context: ./order
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/order-service:${{ env.IMAGE_TAG }}

    - name: Build and Push Product Service
      uses: docker/build-push-action@v5
      with:
        context: ./product
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/product-service:${{ env.IMAGE_TAG }}

    - name: Build and Push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway-service:${{ env.IMAGE_TAG }}

  deploy-to-eks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

    - name: Update Image Names in Manifests
      run: |
        sed -i "s|image: auth-service:latest|image: $DOCKER_USERNAME/auth-service:$IMAGE_TAG|g" k8s/auth.yaml
        sed -i "s|image: order-service:latest|image: $DOCKER_USERNAME/order-service:$IMAGE_TAG|g" k8s/order.yaml
        sed -i "s|image: product-service:latest|image: $DOCKER_USERNAME/product-service:$IMAGE_TAG|g" k8s/product.yaml
        sed -i "s|image: api-gateway-service:latest|image: $DOCKER_USERNAME/api-gateway-service:$IMAGE_TAG|g" k8s/api-gateway.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/rabbitmq.yaml
        kubectl apply -f k8s/auth.yaml
        kubectl apply -f k8s/order.yaml
        kubectl apply -f k8s/product.yaml
        kubectl apply -f k8s/api-gateway.yaml
